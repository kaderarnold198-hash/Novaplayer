name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extraire, ajouter Xtream v2.3 (Dossier Public + Arriere-Plan + Auto-Wifi)
        run: |
          python3 -c "import zipfile; zipfile.ZipFile('NovaPlayer_Package.pdf').extractall('.')"
          python3 -c "import lzma, base64; exec(lzma.decompress(base64.b64decode('')).decode('utf-8'))"
          sed -i 's/assembleRelease/assembleRelease -x lintVitalRelease/g' build_and_sign_apk.sh
          gradle wrapper --gradle-version 8.9
          chmod +x gradlew build_and_sign_apk.sh
          ./build_and_sign_apk.sh
      - name: Publier APK v2.3 Xtream en telechargement direct
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v1.0.0 --cleanup-tag -y || true
          gh release create v1.0.0 dist/*.apk --title "Nova Player Premium v2.3 (Dossier Public + Reprise Auto Wi-Fi + Arriere-plan)" --notes "Version 2.3 : enregistrement dans Telechargements/NovaPlayer, telechargement actif en arriere-plan, reprise automatique quand le Wi-Fi revient, et reconnexion auto des chaines en direct."
