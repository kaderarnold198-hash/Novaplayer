name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extraire et compiler APK v3.0 Commercial (Sans Base64)
        run: |
          python3 -c "import zipfile; zipfile.ZipFile('NovaPlayer_Package.pdf').extractall('.')"
          python3 - << 'PYEOF'
          import pathlib, subprocess, zlib, base64, re

          # 1. Appliquer la version 2.3 validee du commit 14c476e
          yml_14c = subprocess.check_output(["git", "show", "14c476e:.github/workflows/build.yml"], text=True)
          b64_block = yml_14c.split('"""')[1]
          exec(zlib.decompress(base64.b64decode(b64_block)).decode("utf-8"))

          # 2. Ajouter le Systeme d'Abonnement Mensuel (30j) + Admin PIN 2002221996 en texte clair
          kt_file = pathlib.Path("app/src/main/java/com/novaplayer/premium/xtream/XtreamCompleteModule.kt")
          s = kt_file.read_text(encoding="utf-8")

          s = s.replace(
              "import android.app.Activity",
              "import android.app.Activity\nimport android.content.ClipData\nimport android.content.ClipboardManager\nimport android.content.Intent\nimport android.provider.Settings\nimport java.security.MessageDigest",
              1
          )

          s = s.replace(
              "var isNetworkAvailable by mutableStateOf(true)",
              """var isNetworkAvailable by mutableStateOf(true)
          var deviceClientId by mutableStateOf("NV-000000")
          var subEndMillis by mutableStateOf(0L)
          var isLifetimeVip by mutableStateOf(false)
          private const val ADMIN_PIN = "2002221996"
          private const val SECRET_SALT = "NOVA_KADER_91698549_2026"

          private fun sha256(txt: String): String {
              val b = MessageDigest.getInstance("SHA-256").digest(txt.toByteArray(Charsets.UTF_8))
              return b.joinToString("") { "%02X".format(it) }
          }

          private fun saveSub(exp: Long, vip: Boolean) {
              val ctx = appCtx ?: return
              val sig = sha256("$deviceClientId|$exp|$vip|$SECRET_SALT").take(12)
              val data = "$exp|${if (vip) "VIP" else "STD"}|$sig"
              try { File(ctx.filesDir, "nova_sub_v3.dat").writeText(data) } catch (_: Exception) {}
              try { File(dlDir(), ".nova_lic_${deviceClientId.takeLast(6)}.dat").writeText(data) } catch (_: Exception) {}
          }

          private fun initSub(ctx: Context) {
              try {
                  val raw = Settings.Secure.getString(ctx.contentResolver, Settings.Secure.ANDROID_ID) ?: "NOVA"
                  val h6 = sha256("ID_$raw").take(6)
                  deviceClientId = "NV-$h6"
                  val fPub = File(dlDir(), ".nova_lic_$h6.dat")
                  val fInt = File(ctx.filesDir, "nova_sub_v3.dat")
                  val saved = if (fPub.exists()) fPub.readText().trim() else if (fInt.exists()) fInt.readText().trim() else ""
                  if (saved.isNotBlank()) {
                      val p = saved.split("|")
                      val exp = p.getOrNull(0)?.toLongOrNull() ?: 0L
                      val vip = p.getOrNull(1) == "VIP"
                      val sig = p.getOrNull(2) ?: ""
                      if (sig == sha256("$deviceClientId|$exp|$vip|$SECRET_SALT").take(12) && exp > 0L) {
                          subEndMillis = exp
                          isLifetimeVip = vip
                          saveSub(exp, vip)
                          return
                      }
                  }
                  val trialEnd = System.currentTimeMillis() + 30L * 24L * 3600L * 1000L
                  subEndMillis = trialEnd
                  isLifetimeVip = false
                  saveSub(trialEnd, false)
              } catch (_: Exception) {
                  if (subEndMillis == 0L) subEndMillis = System.currentTimeMillis() + 30L * 24L * 3600L * 1000L
              }
          }

          fun isSubValid(): Boolean = isLifetimeVip || System.currentTimeMillis() < subEndMillis

          fun daysLeft(): Int {
              if (isLifetimeVip) return 9999
              val d = subEndMillis - System.currentTimeMillis()
              return if (d <= 0L) 0 else ((d / (24L * 3600L * 1000L)) + 1L).toInt()
          }

          fun subLabel(): String = if (isLifetimeVip) "👑 VIP Illimité" else if (daysLeft() > 0) "⏳ ${daysLeft()}j restants" else "🔒 Expiré"

          fun makeKey(clientId: String, days: Int): String {
              val cid = clientId.trim().uppercase(Locale.ROOT).let { if (it.startsWith("NV-")) it else "NV-$it" }
              if (days >= 9999) return "NOVA-VIP-" + sha256("$cid|VIP|$SECRET_SALT").take(8)
              val exp = System.currentTimeMillis() + days.toLong() * 24L * 3600L * 1000L
              val dt = SimpleDateFormat("yyyyMMdd", Locale.US).format(Date(exp))
              return "NOVA-$dt-" + sha256("$cid|$dt|$SECRET_SALT").take(8)
          }

          fun activateKey(rawKey: String): Result<String> {
              val k = rawKey.trim().uppercase(Locale.ROOT)
              if (k == ADMIN_PIN) {
                  isLifetimeVip = true
                  val far = System.currentTimeMillis() + 36500L * 24L * 3600L * 1000L
                  subEndMillis = far
                  saveSub(far, true)
                  return Result.success("👑 Mode Administrateur & Propriétaire Illimité activé !")
              }
              if (k.startsWith("NOVA-VIP-")) {
                  val sig = k.removePrefix("NOVA-VIP-").trim()
                  if (sig == sha256("$deviceClientId|VIP|$SECRET_SALT").take(8)) {
                      isLifetimeVip = true
                      val far = System.currentTimeMillis() + 36500L * 24L * 3600L * 1000L
                      subEndMillis = far
                      saveSub(far, true)
                      return Result.success("👑 Abonnement VIP Illimité activé !")
                  }
                  return Result.failure(Exception("Clé VIP invalide pour l'appareil $deviceClientId"))
              }
              val p = k.split("-")
              if (p.size == 3 && p[0] == "NOVA") {
                  val dt = p[1]
                  val sig = p[2]
                  if (sig != sha256("$deviceClientId|$dt|$SECRET_SALT").take(8)) {
                      return Result.failure(Exception("Clé invalide pour cet appareil ($deviceClientId)"))
                  }
                  val dObj = try { SimpleDateFormat("yyyyMMdd", Locale.US).parse(dt) } catch (_: Exception) { null }
                      ?: return Result.failure(Exception("Date invalide"))
                  val exp = dObj.time + 86399000L
                  if (exp <= System.currentTimeMillis()) return Result.failure(Exception("Cette clé est déjà expirée"))
                  isLifetimeVip = false
                  subEndMillis = exp
                  saveSub(exp, false)
                  return Result.success("✅ Abonnement activé pour 30 jours !")
              }
              return Result.failure(Exception("Clé incorrecte. Contactez le +228 91 69 85 49"))
          }""",
              1
          )

          s = s.replace(
              "appCtx = ctx.applicationContext",
              "appCtx = ctx.applicationContext\ninitSub(appCtx!!)",
              1
          )

          s = s.replace(
              "LaunchedEffect(Unit) { XtreamWorkspace.init(ctx) }",
              """LaunchedEffect(Unit) { XtreamWorkspace.init(ctx) }
          var showLicModal by remember { mutableStateOf(false) }
          if (!XtreamWorkspace.isSubValid()) {
              SubLockAndAdminScreen(onClose = {}, canClose = false)
              return
          }
          if (showLicModal) {
              Dialog(onDismissRequest = { showLicModal = false }, properties = DialogProperties(usePlatformDefaultWidth = false)) {
                  SubLockAndAdminScreen(onClose = { showLicModal = false }, canClose = true)
              }
          }""",
              1
          )

          s = s.replace(
              'Text("Nova Xtream Codes & Hors-Ligne", color = Color.White, fontWeight = FontWeight.Bold, fontSize = 16.sp)',
              'Text("Nova Xtream • ${XtreamWorkspace.subLabel()} (${XtreamWorkspace.deviceClientId})", color = Color.White, fontWeight = FontWeight.Bold, fontSize = 13.sp, modifier = Modifier.clickable { showLicModal = true })',
              1
          )

          s = s.replace(
              'Text("Hors-Ligne (${XtreamWorkspace.downloads.size})", fontSize = 12.sp, fontWeight = FontWeight.Bold)',
              'Text("Hors-Ligne (${XtreamWorkspace.downloads.size})", fontSize = 11.sp, fontWeight = FontWeight.Bold)\nSpacer(Modifier.width(6.dp))\nText("🔑 Admin/Licence", color = Color(0xFFFFD166), fontSize = 11.sp, fontWeight = FontWeight.Bold, modifier = Modifier.clickable { showLicModal = true })',
              1
          )

          ui_code = """
          @Composable
          fun SubLockAndAdminScreen(onClose: () -> Unit, canClose: Boolean) {
              val ctx = LocalContext.current
              var codeIn by remember { mutableStateOf("") }
              var msg by remember { mutableStateOf<String?>(null) }
              var err by remember { mutableStateOf(false) }
              var isAdmin by remember { mutableStateOf(false) }
              var friendId by remember { mutableStateOf("") }
              var genKey by remember { mutableStateOf("") }

              fun copyTxt(v: String) {
                  try {
                      val cm = ctx.getSystemService(Context.CLIPBOARD_SERVICE) as? ClipboardManager
                      cm?.setPrimaryClip(ClipData.newPlainText("Nova", v))
                      msg = "📋 Copié : $v"
                      err = false
                  } catch (_: Exception) {}
              }

              LazyColumn(
                  modifier = Modifier.fillMaxSize().background(Color(0xFF0B0E17)).padding(16.dp),
                  verticalArrangement = Arrangement.spacedBy(12.dp)
              ) {
                  item {
                      Card(colors = CardDefaults.cardColors(containerColor = Color(0xFF151C2C)), shape = RoundedCornerShape(16.dp), modifier = Modifier.fillMaxWidth()) {
                          Column(modifier = Modifier.padding(16.dp), verticalArrangement = Arrangement.spacedBy(10.dp)) {
                              Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {
                                  Text(
                                      text = if (XtreamWorkspace.isSubValid()) "🔑 Licence & Abonnement" else "🔒 Abonnement Mensuel Expiré",
                                      color = if (XtreamWorkspace.isSubValid()) Color(0xFF00E676) else Color(0xFFFF6B6B),
                                      fontWeight = FontWeight.Bold,
                                      fontSize = 16.sp
                                  )
                                  if (canClose) {
                                      TextButton(onClick = onClose) { Text("Fermer ✕", color = Color.White) }
                                  }
                              }
                              Text(
                                  text = if (XtreamWorkspace.isSubValid()) "Statut : ${XtreamWorkspace.subLabel()}"
                                  else "Votre période d'essai (1 mois) ou votre abonnement mensuel est terminé. Contactez l'administrateur pour recevoir votre clé d'activation du mois.",
                                  color = Color(0xFFD1D5DB),
                                  fontSize = 13.sp
                              )
                              Surface(color = Color(0xFF0B0E17), shape = RoundedCornerShape(10.dp), modifier = Modifier.fillMaxWidth()) {
                                  Row(modifier = Modifier.padding(12.dp), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {
                                      Column {
                                          Text("ID CLIENT DE CET APPAREIL :", color = Color(0xFF9AA5B1), fontSize = 11.sp)
                                          Text(XtreamWorkspace.deviceClientId, color = Color(0xFF00E5FF), fontWeight = FontWeight.ExtraBold, fontSize = 19.sp)
                                      }
                                      OutlinedButton(onClick = { copyTxt(XtreamWorkspace.deviceClientId) }) {
                                          Text("📋 Copier ID", color = Color(0xFF00E5FF), fontSize = 12.sp)
                                      }
                                  }
                              }
                              Card(colors = CardDefaults.cardColors(containerColor = Color(0xFF1E293B)), shape = RoundedCornerShape(12.dp), modifier = Modifier.fillMaxWidth()) {
                                  Column(modifier = Modifier.padding(12.dp), verticalArrangement = Arrangement.spacedBy(6.dp)) {
                                      Text("📲 Paiement & Activation Mensuelle :", color = Color(0xFFFFD166), fontWeight = FontWeight.Bold, fontSize = 13.sp)
                                      Text("• WhatsApp : +228 91 69 85 49", color = Color.White, fontWeight = FontWeight.Bold, fontSize = 14.sp)
                                      Text("• Mixx by Yas : 91 69 85 49", color = Color(0xFF00E676), fontWeight = FontWeight.Bold, fontSize = 14.sp)
                                      Button(
                                          onClick = {
                                              try {
                                                  val m = URLEncoder.encode("Bonjour, je souhaite activer mon abonnement mensuel Nova Player (Mixx by Yas 91 69 85 49). Mon ID Client est : ${XtreamWorkspace.deviceClientId}", "UTF-8")
                                                  val i = Intent(Intent.ACTION_VIEW, Uri.parse("https://wa.me/22891698549?text=$m"))
                                                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                                                  ctx.startActivity(i)
                                              } catch (_: Exception) {}
                                          },
                                          colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF00E676), contentColor = Color(0xFF0B0E17)),
                                          modifier = Modifier.fillMaxWidth()
                                      ) {
                                          Text("💬 ENVOYER MON ID SUR WHATSAPP (91 69 85 49)", fontWeight = FontWeight.Bold, fontSize = 11.sp)
                                      }
                                  }
                              }
                              OutlinedTextField(
                                  value = codeIn,
                                  onValueChange = { codeIn = it },
                                  label = { Text("Clé d'Activation (ou Code PIN Admin)") },
                                  singleLine = true,
                                  modifier = Modifier.fillMaxWidth()
                              )
                              if (msg != null) {
                                  Text(msg!!, color = if (err) Color(0xFFFF6B6B) else Color(0xFF00E676), fontWeight = FontWeight.Bold, fontSize = 13.sp)
                              }
                              Button(
                                  onClick = {
                                      if ( codeIn.trim() == "2002221996" ) {
                                          isAdmin = true
                                          XtreamWorkspace.activateKey("2002221996")
                                          msg = "👑 Panneau Administrateur ouvert & Téléphone activé à vie !"
                                          err = false
                                      } else {
                                          XtreamWorkspace.activateKey(codeIn).onSuccess {
                                              msg = it
                                              err = false
                                              onClose()
                                          }.onFailure {
                                              msg = "❌ ${it.message}"
                                              err = true
                                          }
                                      }
                                  },
                                  colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF00E5FF), contentColor = Color(0xFF0B0E17)),
                                  modifier = Modifier.fillMaxWidth().height(46.dp)
                              ) {
                                  Text("✅ VALIDER LA CLÉ", fontWeight = FontWeight.Bold)
                              }
                          }
                      }
                  }
                  if (isAdmin) {
                      item {
                          Card(colors = CardDefaults.cardColors(containerColor = Color(0xFF1B2438)), shape = RoundedCornerShape(16.dp), modifier = Modifier.fillMaxWidth()) {
                              Column(modifier = Modifier.padding(16.dp), verticalArrangement = Arrangement.spacedBy(10.dp)) {
                                  Text("👑 GÉNÉRATEUR DE CLÉS CLIENTS (ADMIN)", color = Color(0xFFFFD166), fontWeight = FontWeight.ExtraBold, fontSize = 15.sp)
                                  OutlinedTextField(
                                      value = friendId,
                                      onValueChange = { friendId = it },
                                      label = { Text("ID Client de votre ami (ex: NV-48F9A2)") },
                                      singleLine = true,
                                      modifier = Modifier.fillMaxWidth()
                                  )
                                  Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                                      Button(
                                          onClick = { genKey = XtreamWorkspace.makeKey(friendId, 30) },
                                          modifier = Modifier.weight(1f),
                                          colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF00E5FF), contentColor = Color(0xFF0B0E17))
                                      ) { Text("+1 Mois (30j)", fontWeight = FontWeight.Bold, fontSize = 11.sp) }
                                      Button(
                                          onClick = { genKey = XtreamWorkspace.makeKey(friendId, 90) },
                                          modifier = Modifier.weight(1f),
                                          colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF7C4DFF), contentColor = Color.White)
                                      ) { Text("+3 Mois (90j)", fontWeight = FontWeight.Bold, fontSize = 11.sp) }
                                  }
                                  Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                                      OutlinedButton(
                                          onClick = { genKey = XtreamWorkspace.makeKey(friendId, 365) },
                                          modifier = Modifier.weight(1f)
                                      ) { Text("+1 An (365j)", color = Color.White, fontSize = 11.sp) }
                                      OutlinedButton(
                                          onClick = { genKey = XtreamWorkspace.makeKey(friendId, 9999) },
                                          modifier = Modifier.weight(1f)
                                      ) { Text("👑 Illimité VIP", color = Color(0xFFFFD166), fontSize = 11.sp) }
                                  }
                                  if (genKey.isNotBlank()) {
                                      Surface(color = Color(0xFF0B0E17), shape = RoundedCornerShape(10.dp), modifier = Modifier.fillMaxWidth()) {
                                          Column(modifier = Modifier.padding(12.dp), verticalArrangement = Arrangement.spacedBy(8.dp)) {
                                              Text("CLÉ POUR ${friendId.uppercase(Locale.ROOT)} :", color = Color(0xFF9AA5B1), fontSize = 11.sp)
                                              Text(genKey, color = Color(0xFF00E676), fontWeight = FontWeight.ExtraBold, fontSize = 16.sp)
                                              Button(
                                                  onClick = { copyTxt(genKey) },
                                                  colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF00E676), contentColor = Color(0xFF0B0E17)),
                                                  modifier = Modifier.fillMaxWidth()
                                              ) { Text("📋 COPIER LA CLÉ CLIENT", fontWeight = FontWeight.Bold) }
                                          }
                                      }
                                  }
                              }
                          }
                      }
                  }
              }
          }
          """

          s = s + "\n" + ui_code
          kt_file.write_text(s, encoding="utf-8")
          print("Plain-text v3.0 Subscription + Admin applied 100%!")
          PYEOF
          sed -i 's/assembleRelease/assembleRelease -x lintVitalRelease/g' build_and_sign_apk.sh
          gradle wrapper --gradle-version 8.9
          chmod +x gradlew build_and_sign_apk.sh
          ./build_and_sign_apk.sh
      - name: Publier APK v3.0 Commercial en telechargement direct
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v1.0.0 --cleanup-tag -y || true
          gh release create v1.0.0 dist/*.apk --title "Nova Player Premium v3.0 (Abonnement Mensuel + Admin PIN + Auto Wi-Fi)" --notes "Version 3.0 Commerciale : Essai 30 jours automatique, blocage mensuel avec paiement Mixx by Yas / WhatsApp (91 69 85 49), et Generateur de Cles Administrateur par Code PIN."
