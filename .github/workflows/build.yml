name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extraire, corriger Audio FFmpeg (v3.2) + Wi-Fi Faible et compiler APK
        run: |
          python3 -c "import zipfile; zipfile.ZipFile('NovaPlayer_Package.pdf').extractall('.')"
          python3 - << 'PYEOF'
          import pathlib, subprocess, re, textwrap

          # 1. Appliquer toute la v3.0 validee du commit 6059b62 (Build #7 vert)
          yml_605 = subprocess.check_output(["git", "show", "6059b62:.github/workflows/build.yml"], text=True)
          py_v30 = textwrap.dedent(yml_605.split("<< 'PYEOF'\n")[1].split("\n          PYEOF")[0])
          exec(py_v30)

          # 2. Ajouter le decodeur FFmpeg Media3 (AC3, E-AC3, DTS, TrueHD) pour l'audio des Films & Series
          toml_path = pathlib.Path("gradle/libs.versions.toml")
          if toml_path.exists():
              t_txt = toml_path.read_text(encoding="utf-8")
              t_txt = re.sub(r'(media3\s*=\s*)"1\.4\.1"', r'\1"1.5.0"', t_txt)
              toml_path.write_text(t_txt, encoding="utf-8")

          gradle_path = pathlib.Path("app/build.gradle.kts")
          if gradle_path.exists():
              g_txt = gradle_path.read_text(encoding="utf-8")
              g_txt = g_txt.replace("1.4.1", "1.5.0")
              if "org.jellyfin.media3:media3-ffmpeg-decoder" not in g_txt:
                  g_txt = g_txt.replace(
                      "dependencies {",
                      'dependencies {\n    implementation("org.jellyfin.media3:media3-ffmpeg-decoder:1.5.0+1")',
                      1
                  )
              gradle_path.write_text(g_txt, encoding="utf-8")

          # 3. Activer FFmpeg Audio (EXTENSION_RENDERER_MODE_PREFER + AudioAttributes) + Mode Wi-Fi Faible (90s buffer)
          kt_file = pathlib.Path("app/src/main/java/com/novaplayer/premium/xtream/XtreamCompleteModule.kt")
          s = kt_file.read_text(encoding="utf-8")

          s = s.replace(
              "import android.app.Activity",
              "import android.app.Activity\nimport androidx.media3.common.AudioAttributes\nimport androidx.media3.common.C\nimport androidx.media3.exoplayer.DefaultLoadControl\nimport androidx.media3.exoplayer.DefaultRenderersFactory\nimport androidx.media3.exoplayer.trackselection.DefaultTrackSelector",
              1
          )

          s = s.replace(
              "var isNetworkAvailable by mutableStateOf(true)",
              "var isNetworkAvailable by mutableStateOf(true)\nvar lowWifiMode by mutableStateOf(true)",
              1
          )

          s = s.replace(
              'var preferHls by remember { mutableStateOf(false) }',
              'var preferHls by remember { mutableStateOf(XtreamWorkspace.lowWifiMode) }\nvar onlyLightSd by remember { mutableStateOf(false) }',
              1
          )

          s = s.replace(
              'if (mode == "live") {\nSpacer(Modifier.width(8.dp))\nFilterChip(selected = preferHls, onClick = { preferHls = !preferHls }, label = { Text(if (preferHls) ".M3U8" else ".TS") })\n}',
              'if (mode == "live") {\nSpacer(Modifier.width(6.dp))\nFilterChip(selected = XtreamWorkspace.lowWifiMode, onClick = { XtreamWorkspace.lowWifiMode = !XtreamWorkspace.lowWifiMode; preferHls = XtreamWorkspace.lowWifiMode }, label = { Text(if (XtreamWorkspace.lowWifiMode) "📶 Éco Wi-Fi ON" else "📶 Normal", fontSize = 11.sp) })\nSpacer(Modifier.width(6.dp))\nFilterChip(selected = onlyLightSd, onClick = { onlyLightSd = !onlyLightSd }, label = { Text(if (onlyLightSd) "⚡ SD Léger" else "Tout", fontSize = 11.sp) })\n}',
              1
          )

          s = s.replace(
              """val player = remember(req.url) {
          val ok = OkHttpDataSource.Factory(XtreamWorkspace.http).setUserAgent(XtreamWorkspace.UA)
          val ds = DefaultDataSource.Factory(ctx, ok)
          ExoPlayer.Builder(ctx).setMediaSourceFactory(DefaultMediaSourceFactory(ctx).setDataSourceFactory(ds)).build().apply {""",
              """var qualityLimit by remember { mutableIntStateOf(if (XtreamWorkspace.lowWifiMode) 900_000 else Int.MAX_VALUE) }
          val trackSelector = remember {
              DefaultTrackSelector(ctx).apply {
                  setParameters(
                      buildUponParameters()
                          .setMaxVideoBitrate(qualityLimit)
                          .setAllowVideoMixedMimeTypeAdaptiveness(true)
                          .setAllowAudioMixedMimeTypeAdaptiveness(true)
                          .setAllowAudioMixedChannelCountAdaptiveness(true)
                          .setExceedAudioConstraintsIfNecessary(true)
                  )
              }
          }
          LaunchedEffect(qualityLimit) {
              trackSelector.setParameters(trackSelector.buildUponParameters().setMaxVideoBitrate(qualityLimit))
          }
          val player = remember(req.url) {
              val userAgent = "IPTVSmartersPlayer"
              val ok = OkHttpDataSource.Factory(XtreamWorkspace.http).setUserAgent(userAgent)
              val ds = DefaultDataSource.Factory(ctx, ok)
              val loadControl = DefaultLoadControl.Builder()
                  .setBufferDurationsMs(25_000, 90_000, 1_500, 3_000)
                  .setPrioritizeTimeOverSizeThresholds(true)
                  .build()
              val renderersFactory = DefaultRenderersFactory(ctx)
                  .setExtensionRendererMode(DefaultRenderersFactory.EXTENSION_RENDERER_MODE_PREFER)
              val audioAttrs = AudioAttributes.Builder()
                  .setUsage(C.USAGE_MEDIA)
                  .setContentType(C.AUDIO_CONTENT_TYPE_MOVIE)
                  .build()
              ExoPlayer.Builder(ctx, renderersFactory)
                  .setTrackSelector(trackSelector)
                  .setLoadControl(loadControl)
                  .setAudioAttributes(audioAttrs, true)
                  .setMediaSourceFactory(DefaultMediaSourceFactory(ctx).setDataSourceFactory(ds))
                  .build().apply {"""
          )

          s = s.replace(
              'IconButton(onClick = { showTracks = true }) { Icon(Icons.Default.Subtitles, contentDescription = "Audio/Sous-titres", tint = Color.White) }',
              'TextButton(onClick = { qualityLimit = when (qualityLimit) { 900_000 -> 450_000; 450_000 -> Int.MAX_VALUE; else -> 900_000 } }) { Text(text = when (qualityLimit) { 450_000 -> "📶 Ultra-Léger"; 900_000 -> "📶 Éco SD"; else -> "📶 HD Auto" }, color = Color(0xFF00E676), fontSize = 11.sp, fontWeight = FontWeight.Bold) }\nIconButton(onClick = { showTracks = true }) { Icon(Icons.Default.Subtitles, contentDescription = "Audio/Sous-titres", tint = Color.White) }'
          )

          kt_file.write_text(s, encoding="utf-8")
          print("Short v3.2 Audio FFmpeg + Low-WiFi applied 100%!")
          PYEOF
          sed -i 's/assembleRelease/assembleRelease -x lintVitalRelease/g' build_and_sign_apk.sh
          gradle wrapper --gradle-version 8.9
          chmod +x gradlew build_and_sign_apk.sh
          ./build_and_sign_apk.sh
      - name: Publier APK v3.2 Audio FFmpeg + Wi-Fi Faible
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v1.0.0 --cleanup-tag -y || true
          gh release create v1.0.0 dist/*.apk --title "Nova Player Premium v3.2 (Audio Films/Series FFmpeg + Wi-Fi Faible)" --notes "Version 3.2 : Ajout du decodeur audio FFmpeg (AC3, E-AC3, DTS, TrueHD) pour les films et series en direct et hors-ligne."
